<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Escudo Base -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#3A1C71" />
    </linearGradient>

    <!-- Gradiente do S+ central -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E6ED" />
    </linearGradient>

    <!-- Sombra suave interna -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Grupo Redimensionado para caber na Zona de Segurança do Android -->
  <g transform="translate(102, 102) scale(0.6)">
    <!-- Escudo Principal (Moldura Externa) -->
    <path d="M 256 32 C 340 32 416 60 448 80 C 448 240 390 390 256 480 C 122 390 64 240 64 80 C 96 60 172 32 256 32 Z" 
          fill="url(#shieldGrad)" />

    <!-- Borda Interna Branca do Escudo -->
    <path d="M 256 56 C 328 56 394 80 422 98 C 422 236 370 366 256 448 C 142 366 90 236 90 98 C 118 80 184 56 256 56 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="12" 
          stroke-opacity="0.35" />

    <!-- Símbolo "S" + "+" Estilizado -->
    <g filter="url(#dropShadow)">
      <!-- Letra S Moderna Tech -->
      <path d="M 310 160 C 230 140 180 180 180 220 C 180 270 310 260 310 315 C 310 360 250 375 195 355" 
            fill="none" 
            stroke="url(#sGrad)" 
            stroke-width="38" 
            stroke-linecap="round" />

      <!-- Símbolo de Mais (+) Integrado na Ponta Superior -->
      <path d="M 335 155 L 375 155 M 355 135 L 355 175" 
            fill="none" 
            stroke="#00F2FE" 
            stroke-width="12" 
            stroke-linecap="round" />
    </g>
  </g>
</svg>
